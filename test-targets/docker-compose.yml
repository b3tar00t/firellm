services:
  ollama:
    image: ollama/ollama:0.3.12
    container_name: vulnrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  vulnrag-easy:
    build: ./vulnrag-easy
    container_name: vulnrag-easy
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL=${MODEL:-llama3}
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_healthy

  vulnrag-hard:
    build: ./vulnrag-hard
    container_name: vulnrag-hard
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL=${MODEL:-llama3}
    ports:
      - "8002:8002"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
